<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0a0c" />
      <stop offset="100%" stop-color="#0f0709" />
    </linearGradient>
    <linearGradient id="fashionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" />
  
  <!-- Aura glow in background -->
  <circle cx="300" cy="200" r="130" fill="#f43f5e" opacity="0.1" filter="url(#glow)" />
  
  <!-- Wireframe fashion items -->
  <g transform="translate(190, 80)">
    <!-- Main Jacket glow -->
    <path d="M 40 10 L 180 10 L 210 50 L 170 120 L 170 230 L 50 230 L 50 120 L 10 50 Z" fill="url(#fashionGrad)" opacity="0.15" filter="url(#glow)" />
    
    <!-- Outer Hanger -->
    <path d="M 90 -10 Q 110 -25, 110 -10 Q 110 5, 80 10 M 110 10 L 140 10" stroke="#fb7185" stroke-width="2.5" fill="none" stroke-linecap="round" />
    
    <!-- Jacket / Coat outlines -->
    <path d="M 50 10 L 80 10 M 140 10 L 170 10" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
    <path d="M 50 10 L 10 50 L 40 110 L 70 85 L 70 230 L 150 230 L 150 85 L 180 110 L 210 50 L 170 10" stroke="#f43f5e" stroke-width="3" fill="none" stroke-linejoin="round" />
    
    <!-- Inner design / zipper -->
    <path d="M 110 10 L 110 230" stroke="url(#fashionGrad)" stroke-width="2" stroke-dasharray="6,4" />
    
    <!-- Collar curves -->
    <path d="M 50 10 C 65 40, 110 70, 110 70 C 110 70, 155 40, 170 10" stroke="#fb7185" stroke-width="3" fill="none" />
    
    <!-- Left pockets -->
    <rect x="80" y="120" width="25" height="20" rx="3" fill="none" stroke="#f43f5e" stroke-width="2" />
    <!-- Right pockets -->
    <rect x="115" y="120" width="25" height="20" rx="3" fill="none" stroke="#f43f5e" stroke-width="2" />
  </g>
  
  <text x="30" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" font-weight="bold">DESIGNER WEAR</text>
  <text x="30" y="370" fill="url(#fashionGrad)" font-family="system-ui, sans-serif" font-size="20" font-weight="extrabold">FASHION &amp; APPAREL</text>
</svg>
