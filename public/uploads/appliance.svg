<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c1e" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="applianceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" />
  
  <!-- Backdrop glow -->
  <circle cx="300" cy="200" r="120" fill="#06b6d4" opacity="0.1" filter="url(#glow)" />
  
  <!-- Appliances outlines -->
  <g transform="translate(180, 80)">
    <!-- Smart Refrigerator Glow -->
    <rect x="-5" y="-5" width="110" height="250" rx="14" fill="url(#applianceGrad)" opacity="0.2" filter="url(#glow)" />
    
    <!-- Smart Refrigerator body -->
    <rect x="0" y="0" width="100" height="240" rx="10" fill="#0b0f19" stroke="#10b981" stroke-width="2" />
    <!-- Doors division -->
    <line x1="0" y1="90" x2="100" y2="90" stroke="#10b981" stroke-width="1.5" />
    <!-- Handles -->
    <line x1="90" y1="30" x2="90" y2="80" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <line x1="90" y1="100" x2="90" y2="180" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    
    <!-- Smart LCD Screen on door -->
    <rect x="15" y="25" width="55" height="40" rx="4" fill="#020617" stroke="#334155" stroke-width="1" />
    <rect x="20" y="32" width="20" height="3" rx="1" fill="#06b6d4" />
    <rect x="20" y="38" width="30" height="3" rx="1" fill="#10b981" />
    <rect x="20" y="44" width="15" height="3" rx="1" fill="#34d399" />
    
    <!-- Blender/Airfryer alongside -->
    <g transform="translate(130, 90)">
      <!-- Backdrop glow -->
      <rect x="-5" y="-5" width="90" height="160" rx="12" fill="url(#applianceGrad)" opacity="0.2" filter="url(#glow)" />
      
      <!-- Smart Coffee Maker / Oven body -->
      <rect x="0" y="0" width="80" height="150" rx="8" fill="#0b0f19" stroke="#06b6d4" stroke-width="2" />
      <!-- Viewing window -->
      <rect x="10" y="25" width="60" height="60" rx="4" fill="#020617" stroke="#1e293b" />
      <!-- Interior light glow -->
      <rect x="15" y="30" width="50" height="50" rx="2" fill="#059669" opacity="0.25" />
      <!-- Controls -->
      <circle cx="20" cy="110" r="8" fill="#1e293b" stroke="#334155" />
      <circle cx="20" cy="110" r="3" fill="#10b981" />
      <rect x="40" y="105" width="30" height="10" rx="2" fill="#020617" stroke="#1e293b" />
      <rect x="44" y="109" width="15" height="2" fill="#06b6d4" />
    </g>
  </g>
  
  <text x="30" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" font-weight="bold">SMART LIVING</text>
  <text x="30" y="370" fill="url(#applianceGrad)" font-family="system-ui, sans-serif" font-size="20" font-weight="extrabold">HOME &amp; KITCHEN APPLIANCES</text>
</svg>
