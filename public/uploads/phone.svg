<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" />
  
  <!-- Ambient glow in background -->
  <circle cx="300" cy="200" r="120" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />
  <circle cx="200" cy="150" r="80" fill="#06b6d4" opacity="0.1" filter="url(#glow)" />
  
  <!-- Phone outline and details -->
  <g transform="translate(230, 80)">
    <!-- Main screen glow -->
    <rect x="-5" y="-5" width="150" height="250" rx="24" fill="url(#glowGrad)" opacity="0.3" filter="url(#glow)" />
    <!-- Phone body -->
    <rect x="0" y="0" width="140" height="240" rx="20" fill="#090d16" stroke="#3730a3" stroke-width="3" />
    <!-- Screen inner line -->
    <rect x="6" y="6" width="128" height="228" rx="15" fill="#030712" />
    <!-- Dynamic notch/island -->
    <rect x="45" y="12" width="50" height="12" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <!-- Futuristic graphic on screen -->
    <circle cx="70" cy="110" r="35" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-dasharray="8,4" />
    <path d="M 50 110 L 90 110 M 70 90 L 70 130" stroke="#06b6d4" stroke-width="2" opacity="0.6" />
    <circle cx="70" cy="110" r="10" fill="#ec4899" filter="url(#glow)" opacity="0.8" />
    
    <!-- Decorative UI elements -->
    <rect x="20" y="170" width="100" height="4" rx="2" fill="#1e293b" />
    <rect x="20" y="180" width="70" height="4" rx="2" fill="#1e293b" />
    <rect x="20" y="190" width="85" height="4" rx="2" fill="#1e293b" />
    
    <!-- Home indicator bar -->
    <rect x="45" y="228" width="50" height="4" rx="2" fill="#334155" />
  </g>
  
  <!-- Dynamic Category Label -->
  <text x="30" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" font-weight="bold">PREMIUM MOBILE</text>
  <text x="30" y="370" fill="url(#glowGrad)" font-family="system-ui, sans-serif" font-size="20" font-weight="extrabold">PHONES &amp; SMART DEVICES</text>
</svg>
