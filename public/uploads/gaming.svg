<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" />
  
  <!-- Gaming mesh ambient aura -->
  <circle cx="300" cy="200" r="130" fill="#d946ef" opacity="0.12" filter="url(#glow)" />
  <circle cx="260" cy="180" r="90" fill="#3b82f6" opacity="0.1" filter="url(#glow)" />
  
  <!-- Game Controller shape -->
  <g transform="translate(160, 100)">
    <!-- Back glow -->
    <path d="M 40 60 C 20 -10, 260 -10, 240 60 C 230 90, 250 170, 210 190 C 180 205, 150 160, 140 160 C 130 160, 100 205, 70 190 C 30 170, 50 90, 40 60 Z" fill="url(#glowGrad)" opacity="0.25" filter="url(#glow)" />
    
    <!-- Controller Body -->
    <path d="M 40 60 C 20 -10, 260 -10, 240 60 C 230 90, 250 170, 210 190 C 182 201, 153 163, 140 163 C 127 163, 98 201, 70 190 C 30 170, 50 90, 40 60 Z" fill="#090d16" stroke="#4f46e5" stroke-width="3" />
    
    <!-- Left Hand Grip texture -->
    <path d="M 50 70 C 45 90, 55 130, 68 150" stroke="#1e293b" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Right Hand Grip texture -->
    <path d="M 230 70 C 235 90, 225 130, 212 150" stroke="#1e293b" stroke-width="6" stroke-linecap="round" fill="none" />
    
    <!-- Left Analog Stick -->
    <circle cx="95" cy="115" r="22" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    <circle cx="95" cy="115" r="12" fill="#1e293b" />
    <circle cx="95" cy="115" r="6" fill="#3b82f6" filter="url(#glow)" />
    
    <!-- Right Analog Stick -->
    <circle cx="185" cy="115" r="22" fill="#0f172a" stroke="#d946ef" stroke-width="2" />
    <circle cx="185" cy="115" r="12" fill="#1e293b" />
    <circle cx="185" cy="115" r="6" fill="#d946ef" filter="url(#glow)" />
    
    <!-- D-Pad (Left Side) -->
    <g transform="translate(85, 45)">
      <rect x="10" y="0" width="10" height="30" rx="2" fill="#1e293b" stroke="#334155" />
      <rect x="0" y="10" width="30" height="10" rx="2" fill="#1e293b" stroke="#334155" />
      <!-- D-pad lights -->
      <circle cx="15" cy="5" r="2" fill="#3b82f6" />
    </g>
    
    <!-- Action Buttons (Right Side) -->
    <g transform="translate(170, 45)">
      <!-- Y Button -->
      <circle cx="15" cy="5" r="6" fill="#1e293b" />
      <text x="12" y="9" fill="#22c55e" font-family="monospace" font-size="9" font-weight="bold">Y</text>
      <!-- X Button -->
      <circle cx="0" cy="20" r="6" fill="#1e293b" />
      <text x="-3" y="24" fill="#3b82f6" font-family="monospace" font-size="9" font-weight="bold">X</text>
      <!-- B Button -->
      <circle cx="30" cy="20" r="6" fill="#1e293b" />
      <text x="27" y="24" fill="#ef4444" font-family="monospace" font-size="9" font-weight="bold">B</text>
      <!-- A Button -->
      <circle cx="15" cy="35" r="6" fill="#1e293b" />
      <text x="12" y="39" fill="#eab308" font-family="monospace" font-size="9" font-weight="bold">A</text>
    </g>
    
    <!-- Center Logo / Power button -->
    <circle cx="140" cy="80" r="14" fill="#0f172a" stroke="#d946ef" stroke-width="2" />
    <path d="M 136 75 L 144 85 M 144 75 L 136 85" stroke="#d946ef" stroke-width="2" />
  </g>
  
  <text x="30" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" letter-spacing="3" font-weight="bold">ENTERTAINMENT &amp; CONSOLES</text>
  <text x="30" y="370" fill="url(#glowGrad)" font-family="system-ui, sans-serif" font-size="20" font-weight="extrabold">GAMING GEAR &amp; ACCESSORIES</text>
</svg>
